# Server - EB uses PORT env variable, fallback to 5000
server.port=${PORT:5000}

# H2 Database - use /tmp for EB (writable directory)
spring.datasource.url=jdbc:h2:file:/tmp/transcriptions;AUTO_SERVER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# JPA - remove explicit dialect (auto-detected, fixes deprecation warning)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Reduce memory usage for t2.micro
spring.jpa.properties.hibernate.connection.pool_size=2
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5
